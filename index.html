<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Dani ❤️</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        /* --- PANTALLA DE BLOQUEO --- */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff9ac7;
            transition: all 1s ease;
        }

        /* Animación de desbloqueo exitoso */
        .unlocked {
            transform: scale(1.5);
            opacity: 0;
            pointer-events: none;
        }

        #login-screen h2 {
            text-shadow: 0 0 15px #ff6ec7;
            margin-bottom: 20px;
            font-size: clamp(20px, 5vw, 30px);
            text-align: center;
        }

        #password-input {
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ff6ec7;
            border-radius: 10px;
            background: transparent;
            color: white;
            text-align: center;
            margin-bottom: 10px;
            outline: none;
            box-shadow: 0 0 10px #ff6ec7;
            transition: 0.3s;
        }

        /* Animación de error (sacudida) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .error {
            animation: shake 0.4s ease-in-out;
            border-color: #ff3b3b !important;
            box-shadow: 0 0 15px #ff3b3b !important;
        }

        #error-msg {
            color: #ff3b3b;
            font-size: 14px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #ff3b3b;
        }

        #login-btn {
            padding: 10px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #ff6ec7;
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px #ff6ec7;
            transition: 0.3s;
        }

        #login-btn:hover {
            background: #ff9ac7;
            transform: scale(1.05);
        }

        /* estrellas */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            opacity: 0.8;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }

        /* contenedor del corazón */
        #container {
            position: relative;
            width: min(70vw, 450px);
            height: min(70vw, 450px);
            animation: beat 1.3s infinite;
            z-index: 5;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.07); }
            100% { transform: scale(1); }
        }

        canvas { position: absolute; top: 0; left: 0; }

        /* palabras */
        .word {
            position: absolute;
            color: #ff9ac7;
            font-size: clamp(10px, 2vw, 16px);
            white-space: nowrap;
            text-shadow: 0 0 10px white, 0 0 20px #ff6ec7;
            opacity: 0;
            animation: fade 1s forwards;
        }

        @keyframes fade { to { opacity: 1; } }

        /* corazones centro */
        #centerHearts {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(30px, 6vw, 60px);
            animation: spin 6s linear infinite;
        }

        .blue { color: #4da6ff; text-shadow: 0 0 20px #4da6ff; }
        .pink { color: #ff6ec7; text-shadow: 0 0 20px #ff6ec7; }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* corazones flotantes */
        .floatHeart {
            position: absolute; font-size: 20px;
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-120px); opacity: 0; }
        }

        /* CONTADOR */
        #countdown-container {
            position: absolute; top: 5%; color: white; text-align: center;
            font-size: clamp(16px, 4vw, 22px); text-shadow: 0 0 15px #ff6ec7; z-index: 10;
        }

        /* CONTENEDOR DEL GIF */
        #video-container {
            position: absolute; bottom: 5%; z-index: 10;
            border: 2px solid #ff6ec7; border-radius: 12px;
            overflow: hidden; box-shadow: 0 0 15px #ff6ec7; width: 250px;
        }

        img.gif-media { display: block; width: 100%; height: auto; }
    </style>
</head>

<body>

    <!-- PANTALLA DE BLOQUEO -->
    <div id="login-screen">
        <h2>Ingresa la clave secreta 💖</h2>
        <input type="password" id="password-input" placeholder="Contraseña">
        <div id="error-msg">Clave incorrecta 💔 Intenta de nuevo.</div>
        <button id="login-btn" onclick="checkPassword()">Entrar</button>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="countdown-container">
        <div id="countdown-text">Faltan <strong id="days-left" style="color: #4da6ff;"></strong> días para nuestro día 9 💖</div>
    </div>

    <div id="container">
        <canvas id="heartLine"></canvas>
        <div id="centerHearts">
            <span class="blue">💙</span>
            <span class="pink">💗</span>
        </div>
    </div>

    <!-- GIF -->
    <div id="video-container">
        <img src="IMG_3850.gif" alt="Nuestro recuerdo" class="gif-media">
    </div>

    <script>
        /* --- LÓGICA DE LA CONTRASEÑA Y ANIMACIONES --- */
        const passwordInput = document.getElementById("password-input");
        const errorMsg = document.getElementById("error-msg");

        function checkPassword() {
            const inputVal = passwordInput.value;
            const secretCode = "Dani0122"; 

            if (inputVal === secretCode) {
                const loginScreen = document.getElementById("login-screen");
                loginScreen.classList.add("unlocked");
                
                setTimeout(() => {
                    loginScreen.style.display = "none";
                }, 1000); 
            } else {
                passwordInput.classList.add("error");
                errorMsg.style.opacity = "1";

                setTimeout(() => {
                    passwordInput.classList.remove("error");
                }, 400);
            }
        }

        passwordInput.addEventListener("input", function() {
            errorMsg.style.opacity = "0";
        });

        passwordInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkPassword();
            }
        });

        /* --- LÓGICA DEL CONTADOR --- */
        function updateCountdown() {
            const today = new Date();
            const currentDay = today.getDate();
            const countdownText = document.getElementById("countdown-text");
            const daysLeftElement = document.getElementById("days-left");

            if (currentDay === 9) {
                countdownText.innerHTML = "¡Feliz día 9, mi amor! 🎉💖";
            } else {
                let targetDate = new Date(today.getFullYear(), today.getMonth(), 9);
                if (currentDay > 9) {
                    targetDate.setMonth(targetDate.getMonth() + 1);
                }
                const diffTime = targetDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                daysLeftElement.innerText = diffDays;
            }
        }
        updateCountdown();

        /* estrellas */
        for(let i=0; i<100; i++){
            let star = document.createElement("div");
            star.className = "star";
            star.style.left = Math.random()*100+"vw";
            star.style.top = Math.random()*100+"vh";
            document.body.appendChild(star);
        }

        /* dibujar corazón */
        const canvas = document.getElementById("heartLine");
        const ctx = canvas.getContext("2d");
        const container = document.getElementById("container");
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;

        const size = container.offsetWidth/2;
        let t = 0;

        function draw(){
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#ff6ec7";
            ctx.lineWidth = 3;
            ctx.beginPath();

            for(let i=0; i<t; i+=0.02){
                let x = 16*Math.pow(Math.sin(i), 3);
                let y = 13*Math.cos(i)-5*Math.cos(2*i)-2*Math.cos(3*i)-Math.cos(4*i);
                let px = size + x*(size/18);
                let py = size - y*(size/18);
                if(i===0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            t += 0.05;

            if(t < Math.PI*2){
                requestAnimationFrame(draw);
            } else {
                createWords();
                heartExplosion();
            }
        }
        draw();

        function createWords(){
            for(let i=0; i<170; i++){
                let angle = Math.PI*2*i/170;
                let x = 16*Math.pow(Math.sin(angle), 3);
                let y = 13*Math.cos(angle)-5*Math.cos(2*angle)-2*Math.cos(3*angle)-Math.cos(4*angle);

                let span = document.createElement("span");
                span.className = "word";
                span.innerText = "I love you Dani";
                span.style.left = size+x*(size/18)+"px";
                span.style.top = size-y*(size/18)+"px";
                span.style.animationDelay = (i*0.02)+"s";
                container.appendChild(span);
            }
        }

        function heartExplosion(){
            for(let i=0; i<40; i++){
                let h = document.createElement("div");
                h.className = "floatHeart";
                h.innerHTML = "💗";
                h.style.left = (window.innerWidth/2+(Math.random()*150-75))+"px";
                h.style.top = (window.innerHeight/2+(Math.random()*150-75))+"px";
                document.body.appendChild(h);
                setTimeout(()=>h.remove(), 2000);
            }
        }

        document.addEventListener("click", function(e){
            if (e.target.tagName.toLowerCase() === 'img' || 
                e.target.id === 'login-screen' || 
                e.target.tagName.toLowerCase() === 'input' || 
                e.target.tagName.toLowerCase() === 'button') return;
                
            let heart = document.createElement("div");
            heart.className = "floatHeart";
            heart.innerHTML = "💗";
            heart.style.left = e.clientX+"px";
            heart.style.top = e.clientY+"px";
            document.body.appendChild(heart);
            setTimeout(()=>heart.remove(), 2000);
        });
    </script>
</body>
</html>
