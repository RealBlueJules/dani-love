<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="Para Dani ❤️">
    <meta property="og:description" content="Sorpresa...">

    <title>Para Dani 💙</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        /* --- PANTALLA DE BLOQUEO --- */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff9ac7;
            transition: all 1s ease;
        }

        .unlocked {
            transform: scale(1.5);
            opacity: 0;
            pointer-events: none;
        }

        #login-screen h2 {
            text-shadow: 0 0 15px #ff6ec7;
            margin-bottom: 20px;
            font-size: clamp(20px, 5vw, 30px);
            text-align: center;
        }

        #password-input {
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ff6ec7;
            border-radius: 10px;
            background: transparent;
            color: white;
            text-align: center;
            margin-bottom: 10px;
            outline: none;
            box-shadow: 0 0 10px #ff6ec7;
            transition: 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .error {
            animation: shake 0.4s ease-in-out;
            border-color: #ff3b3b !important;
            box-shadow: 0 0 15px #ff3b3b !important;
        }

        #error-msg {
            color: #ff3b3b;
            font-size: 14px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #ff3b3b;
        }

        #login-btn {
            padding: 10px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #ff6ec7;
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px #ff6ec7;
            transition: 0.3s;
        }

        #login-btn:hover {
            background: #ff9ac7;
            transform: scale(1.05);
        }

        /* estrellas */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            opacity: 0.8;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }

        /* contenedor del corazón */
        #container {
            position: absolute;
            top: 20%;
            width: min(50vw, 280px);
            height: min(50vw, 280px);
            animation: beat 1.3s infinite;
            z-index: 5;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.07); }
            100% { transform: scale(1); }
        }

        canvas.heart { position: absolute; top: 0; left: 0; }

        /* palabras */
        .word {
            position: absolute;
            color: #ff9ac7;
            font-size: clamp(8px, 1.5vw, 12px); 
            white-space: nowrap;
            text-shadow: 0 0 10px white, 0 0 20px #ff6ec7;
            opacity: 0;
            animation: fade 1s forwards;
        }

        @keyframes fade { to { opacity: 1; } }

        /* corazones centro */
        #centerHearts {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(20px, 4vw, 40px); 
            animation: spin 6s linear infinite;
        }

        .blue { color: #4da6ff; text-shadow: 0 0 20px #4da6ff; }
        .pink { color: #ff6ec7; text-shadow: 0 0 20px #ff6ec7; }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* corazones flotantes */
        .floatHeart {
            position: absolute; font-size: 20px;
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            z-index: 200;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-120px); opacity: 0; }
        }

        /* CONTADOR */
        #countdown-container {
            position: absolute; top: 3%; color: white; text-align: center;
            font-size: clamp(16px, 4vw, 22px); text-shadow: 0 0 15px #ff6ec7; z-index: 10;
        }

        /* CONTENEDOR DEL GIF Y CALENDARIO */
        #content-wrapper {
            position: absolute;
            bottom: 3%;
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: flex-end;
            z-index: 10;
            display: none; /* Oculto al inicio */
        }

        #video-container {
            border: 2px solid #ff6ec7; border-radius: 12px;
            overflow: hidden; box-shadow: 0 0 15px #ff6ec7; width: 180px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #video-container:hover {
            transform: scale(1.05);
        }

        img.gif-media { display: block; width: 100%; height: auto; }

        /* CALENDARIO */
        #calendar-container {
            background: rgba(20, 0, 10, 0.7);
            border: 2px solid #4da6ff;
            border-radius: 12px;
            padding: 10px 15px;
            box-shadow: 0 0 15px #4da6ff;
            font-size: clamp(12px, 2.5vw, 14px);
        }

        #calendar-container h3 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #ff9ac7;
            text-shadow: 0 0 5px #ff9ac7;
            font-size: 16px;
        }
        #toggle-calendar-btn{
            padding:10px 15px;
            border:none;
            border-radius:10px;
            background:#4da6ff;
            color:white;
            cursor:pointer;
            font-weight:bold;
            box-shadow:0 0 10px #4da6ff;
        }

        #calendar-container{
            display:none;
        }
        .cal-row { display: flex; justify-content: space-between; margin-bottom: 5px; gap: 15px; }
        .cal-days { font-weight: bold; }
        .inf { color: #4da6ff; }
        .fert { color: #ff9ac7; }
        .muy-fert { color: #ff3b3b; font-weight: bold; text-shadow: 0 0 5px rgba(255,59,59,0.5); }

        /* --- MODAL DEL JUEGO --- */
        #game-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 300;
            display: none; /* Oculto por defecto */
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            background: #111;
            border: 2px solid #ff6ec7;
            border-radius: 8px;
            box-shadow: 0 0 20px #ff6ec7;
        }

        #score-display {
            color: #ff9ac7;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff9ac7;
        }

        #close-game {
            position: absolute;
            top: 20px; right: 20px;
            background: #ff3b3b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px; height: 40px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff3b3b;
        }

        #game-instructions {
            margin-top: 15px;
            color: #4da6ff;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            #content-wrapper {
                flex-direction: column;
                align-items: center;
                bottom: 2%;
            }
            #video-container { width: 150px; }
        }
    </style>
</head>

<body>

    <div id="login-screen">
        <h2>Ingresa la clave secreta 🤨💖</h2>
        <input type="password" id="password-input" placeholder="Contraseña">
        <div id="error-msg">Clave incorrecta 💔 Intenta de nuevo.</div>
        <button id="login-btn" onclick="checkPassword()">Entrar</button>
    </div>

    <div id="countdown-container">
        <div id="countdown-text">Faltan <strong id="days-left" style="color: #4da6ff;"></strong> días para el día 🧛🏻 💖</div>
    </div>

    <div id="container">
        <canvas id="heartLine" class="heart"></canvas>
        <div id="centerHearts">
            <span class="blue">💙</span>
            <span class="pink">💗</span>
        </div>
    </div>

    <div id="content-wrapper">
        <div id="video-container" title="¡Haz clic para jugar!">
            <img id="secret-gif" data-src="IMG_3850.gif" alt="Nuestro recuerdo" class="gif-media">
        </div>
        <button id="toggle-calendar-btn">🌸 Mostrar</button>
        <div id="calendar-container">
            <h3>Ciclo 🌸</h3>
            <div class="cal-row"><span class="cal-days">Día 1-9:</span> <span class="inf">infértil</span></div>
            <div class="cal-row"><span class="cal-days">Día 10-12:</span> <span class="fert">fértil</span></div>
            <div class="cal-row"><span class="cal-days">Día 13-16:</span> <span class="muy-fert">MUY FÉRTIL</span></div>
            <div class="cal-row"><span class="cal-days">Día 17-18:</span> <span class="fert">fértil</span></div>
            <div class="cal-row"><span class="cal-days">Día 19-29/30:</span> <span class="inf">infértil</span></div>
        </div>
    </div>

    <div id="game-modal">
        <button id="close-game" onclick="closeGame()">X</button>
        <div id="score-display">Puntos: 0</div>
        <canvas id="gameCanvas" width="600" height="250"></canvas>
        <div id="game-instructions">Toca la pantalla o presiona Espacio para saltar</div>
    </div>

    <script>
        /* --- LÓGICA DE LA CONTRASEÑA --- */
        const passwordInput = document.getElementById("password-input");
        const errorMsg = document.getElementById("error-msg");

        function checkPassword() {
            const inputVal = passwordInput.value.trim().toLowerCase();
            const secretCode = "dani0122"; 

            if (inputVal === secretCode) {
                const loginScreen = document.getElementById("login-screen");
                loginScreen.classList.add("unlocked");
                
                const secretGif = document.getElementById("secret-gif");
                secretGif.src = secretGif.getAttribute("data-src");
                document.getElementById("content-wrapper").style.display = "flex";

                setTimeout(() => {
                    loginScreen.style.display = "none";
                }, 1000); 
            } else {
                passwordInput.classList.add("error");
                errorMsg.style.opacity = "1";
                setTimeout(() => { passwordInput.classList.remove("error"); }, 400);
            }
        }

        passwordInput.addEventListener("input", () => errorMsg.style.opacity = "0");
        passwordInput.addEventListener("keypress", (e) => { if (e.key === "Enter") { e.preventDefault(); checkPassword(); } });

        /* --- LÓGICA DEL CONTADOR --- */
        function updateCountdown() {
            const today = new Date();
            const currentDay = today.getDate();
            const countdownText = document.getElementById("countdown-text");
            const daysLeftElement = document.getElementById("days-left");

            if (currentDay === 9) {
                countdownText.innerHTML = "¡Feliz día 9, mi amor! 🎉💖";
            } else {
                let targetDate = new Date(today.getFullYear(), today.getMonth(), 9);
                if (currentDay > 9) targetDate.setMonth(targetDate.getMonth() + 1);
                const diffTime = targetDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                daysLeftElement.innerText = diffDays;
            }
        }
        updateCountdown();

        /* --- LÓGICA DEL CALENDARIO --- */
        document.getElementById("toggle-calendar-btn").addEventListener("click", () => {
            const cal = document.getElementById("calendar-container");

            if(cal.style.display === "none" || cal.style.display === ""){
                cal.style.display = "block";
                document.getElementById("toggle-calendar-btn").innerText = "Ocultar 🌸";
            } else {
                cal.style.display = "none";
                document.getElementById("toggle-calendar-btn").innerText = "Mostrar 🌸";
            }
        });
        
        /* --- FONDO ESTRELLADO --- */
        for(let i=0; i<100; i++){
            let star = document.createElement("div");
            star.className = "star";
            star.style.left = Math.random()*100+"vw";
            star.style.top = Math.random()*100+"vh";
            document.body.appendChild(star);
        }

        /* --- DIBUJAR CORAZÓN --- */
        const canvasCorazon = document.getElementById("heartLine");
        const ctxCorazon = canvasCorazon.getContext("2d");
        const container = document.getElementById("container");
        canvasCorazon.width = container.offsetWidth;
        canvasCorazon.height = container.offsetHeight;

        const size = container.offsetWidth/2;
        let t = 0;

        function draw(){
            ctxCorazon.clearRect(0, 0, canvasCorazon.width, canvasCorazon.height);
            ctxCorazon.strokeStyle = "#ff6ec7";
            ctxCorazon.lineWidth = 3;
            ctxCorazon.beginPath();

            for(let i=0; i<t; i+=0.02){
                let x = 16*Math.pow(Math.sin(i), 3);
                let y = 13*Math.cos(i)-5*Math.cos(2*i)-2*Math.cos(3*i)-Math.cos(4*i);
                let px = size + x*(size/18);
                let py = size - y*(size/18);
                if(i===0) ctxCorazon.moveTo(px, py);
                else ctxCorazon.lineTo(px, py);
            }
            ctxCorazon.stroke();
            t += 0.05;

            if(t < Math.PI*2){
                requestAnimationFrame(draw);
            } else {
                createWords();
                heartExplosion();
            }
        }
        draw();

        function createWords(){
            for(let i=0; i<170; i++){
                let angle = Math.PI*2*i/170;
                let x = 16*Math.pow(Math.sin(angle), 3);
                let y = 13*Math.cos(angle)-5*Math.cos(2*angle)-2*Math.cos(3*angle)-Math.cos(4*angle);

                let span = document.createElement("span");
                span.className = "word";
                span.innerText = "I love you Dani";
                span.style.left = size+x*(size/18)+"px";
                span.style.top = size-y*(size/18)+"px";
                span.style.animationDelay = (i*0.02)+"s";
                container.appendChild(span);
            }
        }

        function heartExplosion(){
            for(let i=0; i<40; i++){
                let h = document.createElement("div");
                h.className = "floatHeart";
                h.innerHTML = "💗";
                h.style.left = (window.innerWidth/2+(Math.random()*150-75))+"px";
                h.style.top = (window.innerHeight/2+(Math.random()*150-75))+"px";
                document.body.appendChild(h);
                setTimeout(()=>h.remove(), 2000);
            }
        }

        /* Corazones al hacer clic en el fondo */
        document.addEventListener("click", function(e){
            if (e.target.closest('#video-container') || 
                e.target.closest('#game-modal') ||
                e.target.id === 'login-screen' || 
                e.target.tagName.toLowerCase() === 'input' || 
                e.target.tagName.toLowerCase() === 'button') return;
                
            let heart = document.createElement("div");
            heart.className = "floatHeart";
            heart.innerHTML = "💗";
            heart.style.left = e.clientX+"px";
            heart.style.top = e.clientY+"px";
            document.body.appendChild(heart);
            setTimeout(()=>heart.remove(), 2000);
        });

        // ==========================================
        // LÓGICA DEL MINIJUEGUITO DEL CONEJO
        // ==========================================

        document.getElementById("video-container").addEventListener("click", () => {
            document.getElementById('game-modal').style.display = 'flex';
            reiniciarJuego();
        });

        function closeGame() {
            document.getElementById('game-modal').style.display = 'none';
            juegoActivo = false;
            musicaFondo.pause(); 
        }

        const canvasJuego = document.getElementById('gameCanvas');
        const ctxJuego = canvasJuego.getContext('2d');

        // Lienzo sincronizado a proporciones nativas reales de 600x250
        const ANCHO_CANVAS = 600;
        const ALTO_CANVAS = 250;
        canvasJuego.width = ANCHO_CANVAS;
        canvasJuego.height = ALTO_CANVAS;

        // --- CARGA DE ASSETS INDEPENDIENTES ---
        const imgRun = new Image(); imgRun.src = './runbunny.png';         
        const imgJump = new Image(); imgJump.src = './jumpbunny.png';       
        const imgBanera = new Image(); imgBanera.src = './banera.png';      
        const imgZanahoria = new Image(); imgZanahoria.src = './carrot.png';  
        const imgFondoDia = new Image(); imgFondoDia.src = './daybg.png';
        const imgFondoNoche = new Image(); imgFondoNoche.src = './nightbg.png';

        const sonidoAgua = new Audio('./splash.mp3');
        const sonidoPuntos = new Audio('./points.mp3');
        const musicaFondo = new Audio('./soundtrack.mp3');
        musicaFondo.loop = true; 

        let assetsCargados = 0;
        const totalAssets = 8; 

        function verificarPrecarga() {
            if (imgRun.complete && imgJump.complete && imgBanera.complete && 
                imgZanahoria.complete && imgFondoDia.complete && imgFondoNoche.complete) {
                return true;
            }
            return false;
        }

        let score = 0;
        let juegoActivo = false;
        let frames = 0; 
        let velocidadJuego = 4;
        let baneras = [];
        let zanahorias = [];

        // Dimensión visual del sprite y su hitbox precisa
        let conejo = { 
            x: 50, 
            y: 50, 
            anchoRender: 75,   // Tamaño en pantalla de la conejita
            altoRender: 75,
            hitboxAncho: 25,   // Área de choque angosta y justa (en píxeles lógicos)
            hitboxAlto: 45
        };
        
        let gravedad = 1.2;      
        let velocidadY = 0;      
        let fuerzaSalto = -14;   
        let enSuelo = false;     
        let nivelSuelo = canvasJuego.height - 110; // Nivel del suelo acoplado a la altura de 250px

        let frameActual = 0;
        let contadorAnimacion = 0;

        function reiniciarJuego() {
            score = 0;
            frames = 0;
            baneras = [];
            zanahorias = [];
            conejo.y = nivelSuelo;
            velocidadY = 0;
            velocidadJuego = 4;
            juegoActivo = true;
            musicaFondo.play().catch(e => console.log("Esperando interacción de usuario para audio"));
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'Space' && document.getElementById('game-modal').style.display === 'flex') {
                e.preventDefault(); 
                if (enSuelo && juegoActivo) saltar();
            }
        });

        canvasJuego.addEventListener('touchstart', e => {
            e.preventDefault(); 
            if (enSuelo && juegoActivo) saltar();
        });

        function saltar() {
            velocidadY = fuerzaSalto;
            enSuelo = false;
        }

        function manejarObstaculosYPremios() {
            // Generador de Bañeras (Obstáculos)
            if (frames % 160 === 0) {
                baneras.push({ 
                    x: canvasJuego.width, 
                    y: nivelSuelo + 25, 
                    anchoHitbox: 25, altoHitbox: 20,   // Hitbox compacta para poder saltar
                    anchoVisual: 60, altoVisual: 45     // Medida estética del dibujo de la tina
                });
            }
            // Generador de Zanahorias (Premios)
            if (frames % 100 === 0) {
                let alturaZanahoria = Math.random() > 0.5 ? nivelSuelo - 15 : nivelSuelo + 25;
                zanahorias.push({ 
                    x: canvasJuego.width, 
                    y: alturaZanahoria, 
                    anchoHitbox: 25, altoHitbox: 25,
                    anchoVisual: 40, altoVisual: 40
                });
            }

            if (frames % 500 === 0) velocidadJuego += 0.5;

            // DIBUJO Y COLISIÓN DE BAÑERAS
            for (let i = 0; i < baneras.length; i++) {
                let b = baneras[i];
                b.x -= velocidadJuego; 
                
                // Lee el asset independiente cortando desde (0,0) con el tamaño nativo de la imagen (imgBanera.width, imgBanera.height)
                if(imgBanera.complete) {
                    ctxJuego.drawImage(imgBanera, 0, 0, imgBanera.width, imgBanera.height, b.x, b.y, b.anchoVisual, b.altoVisual); 
                }

                // Colisión ajustada al centro de la hitbox
                const cCenterX = conejo.x + (conejo.anchoRender / 2);
                const cCenterY = conejo.y + (conejo.altoRender / 2);
                
                if (cCenterX > b.x + (b.anchoVisual/2 - b.anchoHitbox/2) && 
                    cCenterX < b.x + (b.anchoVisual/2 + b.anchoHitbox/2) &&
                    cCenterY > b.y + (b.altoVisual/2 - b.altoHitbox/2) && 
                    cCenterY < b.y + (b.altoVisual/2 + b.altoHitbox/2)) {
                    
                    juegoActivo = false; 
                    sonidoAgua.play().catch(e => {}); 
                    alert("¡Te caíste en la bañera! 💦 Recogiste " + score + " zanahorias.");
                    reiniciarJuego();
                }
            }

            // DIBUJO Y COLISIÓN DE ZANAHORIAS
            for (let i = 0; i < zanahorias.length; i++) {
                let z = zanahorias[i];
                z.x -= velocidadJuego;
                
                if(imgZanahoria.complete) {
                    ctxJuego.drawImage(imgZanahoria, 0, 0, imgZanahoria.width, imgZanahoria.height, z.x, z.y, z.anchoVisual, z.altoVisual); 
                }

                const cCenterX = conejo.x + (conejo.anchoRender / 2);
                const cCenterY = conejo.y + (conejo.altoRender / 2);

                if (cCenterX > z.x + (z.anchoVisual/2 - z.anchoHitbox/2) && 
                    cCenterX < z.x + (z.anchoVisual/2 + z.anchoHitbox/2) &&
                    cCenterY > z.y + (z.altoVisual/2 - z.altoHitbox/2) && 
                    cCenterY < z.y + (z.altoVisual/2 + z.altoHitbox/2)) {
                    
                    sc += 10; // Nota: en tu variable global se llama sc, lo dejamos consistente con score
                    score += 10; 
                    sonidoPuntos.play().catch(e => {}); 
                    zanahorias.splice(i, 1); 
                    i--;
                }
            }
        }

        function actualizarFondo() {
            // Alternancia de fondos cada 500 puntos (Día / Noche)
            let etapaFondo = Math.floor(score / 500);
            let imgFondoActual = (etapaFondo % 2 === 0) ? imgFondoDia : imgFondoNoche;

            if (imgFondoActual.complete) {
                ctxJuego.drawImage(imgFondoActual, 0, 0, canvasJuego.width, canvasJuego.height);
            } else {
                ctxJuego.fillStyle = (etapaFondo % 2 === 0) ? '#70c5eb' : '#181124';
                ctxJuego.fillRect(0, 0, canvasJuego.width, canvasJuego.height);
            }
            
            // Suelo visible
            ctxJuego.fillStyle = (etapaFondo % 2 === 0) ? '#ff6ec7' : '#bd7ffc'; 
            ctxJuego.fillRect(0, nivelSuelo + 75, canvasJuego.width, 4);
        }

        function actualizarJuego() {
            if (document.getElementById('game-modal').style.display === 'flex' && juegoActivo) {
                ctxJuego.clearRect(0, 0, canvasJuego.width, canvasJuego.height);
                
                if (!verificarPrecarga()) {
                    requestAnimationFrame(actualizarJuego);
                    return;
                }

                frames++; 

                // 1. Fondo
                actualizarFondo();

                // 2. Obstáculos
                manejarObstaculosYPremios();

                // 3. Gravedad
                velocidadY += gravedad; 
                conejo.y += velocidadY; 

                if (conejo.y > nivelSuelo) {
                    conejo.y = nivelSuelo; 
                    velocidadY = 0;  // Consistencia con tu variable global velocidadY
                    velocidadY = 0;
                    velocidadY = 0;      
                    enSuelo = true;        
                }

                // 4. Animación de la conejita con proporciones matemáticas nativas
                if (!enSuelo) {
                    // Fotograma estático de salto leyendo su propio archivo (120x120)
                    if(imgJump.complete) {
                        ctxJuego.drawImage(imgJump, 0, 0, imgJump.width, imgJump.height, conejo.x, conejo.y - 10, conejo.anchoRender, conejo.altoRender);
                    }
                } else {
                    // Carrera: Tira horizontal dividida exactamente entre sus 8 fotogramas (Asumiendo cuadros limpios de 120x120 nativos)
                    if(imgRun.complete) {
                        const totalFotogramasCarrera = 8;
                        const anchoFotogramaNativo = imgRun.width / totalFotogramasCarrera;
                        const posXSprite = frameActual * anchoFotogramaNativo;
                        
                        ctxJuego.drawImage(imgRun, posXSprite, 0, anchoFotogramaNativo, imgRun.height, conejo.x, conejo.y, conejo.anchoRender, conejo.altoRender);

                        contadorAnimacion++;
                        if (contadorAnimacion % 6 === 0) {
                            frameActual++;
                            if (frameActual >= totalFotogramasCarrera) frameActual = 0; 
                        }
                    }
                }
                
                document.getElementById('score-display').innerText = "Zanahorias: " + score;
            }
            
            requestAnimationFrame(actualizarJuego); 
        }

        // Bucle principal inicial
        requestAnimationFrame(actualizarJuego);
    </script>
</body>
</html>
