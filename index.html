<!DOCTYPE html>
<html lang="nah">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Náhuatl</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            padding: 20px;
        }

        .frase {
            font-size: clamp(2rem, 5.5vw, 6.5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin: 12px 0;
            text-shadow: 0 0 25px rgba(0, 119, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="frase">Amo nimitztlasohtla</div>
    <div class="frase">Amo nimitzneki</div>

</body>
</html>
