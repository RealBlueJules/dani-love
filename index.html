<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dani ❤️</title>

<style>

body{
margin:0;
background:black;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

/* estrellas */

.star{
position:absolute;
width:2px;
height:2px;
background:white;
opacity:0.8;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.2;}
to{opacity:1;}
}

/* contenedor */

#container{
position:relative;
width:min(90vw,600px);
height:min(90vw,600px);
animation:beat 1.3s infinite;
}

@keyframes beat{
0%{transform:scale(1);}
50%{transform:scale(1.07);}
100%{transform:scale(1);}
}

/* palabras */

.word{
position:absolute;
color:#ff9ac7;
font-size:clamp(10px,2vw,18px);
white-space:nowrap;
text-shadow:0 0 10px white,0 0 20px #ff9ac7;
opacity:0;
animation:fade 1s forwards;
}

@keyframes fade{
to{opacity:1;}
}

/* corazones centrales */

#centerHearts{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:clamp(40px,8vw,70px);
animation:spin 6s linear infinite;
}

.blue{
color:#4da6ff;
text-shadow:0 0 20px #4da6ff;
}

.pink{
color:#ff6ec7;
text-shadow:0 0 20px #ff6ec7;
}

@keyframes spin{
from{transform:translate(-50%,-50%) rotate(0deg);}
to{transform:translate(-50%,-50%) rotate(360deg);}
}

/* partículas */

.particle{
position:absolute;
width:4px;
height:4px;
background:pink;
border-radius:50%;
opacity:0.8;
animation:float 3s linear infinite;
}

@keyframes float{
from{
transform:translateY(0);
opacity:1;
}
to{
transform:translateY(-120px);
opacity:0;
}
}

</style>

</head>

<body>

<div id="container">

<div id="centerHearts">
<span class="blue">💙</span>
<span class="pink">💗</span>
</div>

</div>

<script>

/* estrellas */

for(let i=0;i<120;i++){

let star=document.createElement("div");
star.className="star";

star.style.left=Math.random()*100+"vw";
star.style.top=Math.random()*100+"vh";

document.body.appendChild(star);

}

/* corazón con texto */

const container=document.getElementById("container");
const size=container.offsetWidth/2;

function heart(t){

let x=16*Math.pow(Math.sin(t),3);
let y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);

return{x:x,y:y};

}

for(let i=0;i<170;i++){

let t=Math.PI*2*i/170;
let pos=heart(t);

let span=document.createElement("span");
span.className="word";
span.innerText="I love you Dani";

span.style.left=size+pos.x*(size/18)+"px";
span.style.top=size-pos.y*(size/18)+"px";
span.style.animationDelay=(i*0.03)+"s";

container.appendChild(span);

}

/* partículas */

setInterval(()=>{

let p=document.createElement("div");
p.className="particle";

p.style.left=(window.innerWidth/2)+"px";
p.style.top=(window.innerHeight/2)+"px";

document.body.appendChild(p);

setTimeout(()=>p.remove(),3000);

},200);

</script>

</body>
</html>
