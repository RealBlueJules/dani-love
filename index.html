<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="Para Dani ❤️">
    <meta property="og:description" content="Sorpresa...">

    <title>Para Dani 💙</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        /* --- PANTALLA DE BLOQUEO --- */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff9ac7;
            transition: all 1s ease;
        }

        .unlocked {
            transform: scale(1.5);
            opacity: 0;
            pointer-events: none;
        }

        #login-screen h2 {
            text-shadow: 0 0 15px #ff6ec7;
            margin-bottom: 20px;
            font-size: clamp(20px, 5vw, 30px);
            text-align: center;
        }

        #password-input {
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ff6ec7;
            border-radius: 10px;
            background: transparent;
            color: white;
            text-align: center;
            margin-bottom: 10px;
            outline: none;
            box-shadow: 0 0 10px #ff6ec7;
            transition: 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .error {
            animation: shake 0.4s ease-in-out;
            border-color: #ff3b3b !important;
            box-shadow: 0 0 15px #ff3b3b !important;
        }

        #error-msg {
            color: #ff3b3b;
            font-size: 14px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #ff3b3b;
        }

        #login-btn {
            padding: 10px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #ff6ec7;
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px #ff6ec7;
            transition: 0.3s;
        }

        #login-btn:hover {
            background: #ff9ac7;
            transform: scale(1.05);
        }

        /* estrellas */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            opacity: 0.8;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }

        /* contenedor del corazón */
        #container {
            position: absolute;
            top: 20%;
            width: min(50vw, 280px);
            height: min(50vw, 280px);
            animation: beat 1.3s infinite;
            z-index: 5;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.07); }
            100% { transform: scale(1); }
        }

        canvas.heart { position: absolute; top: 0; left: 0; }

        /* palabras */
        .word {
            position: absolute;
            color: #ff9ac7;
            font-size: clamp(8px, 1.5vw, 12px); 
            white-space: nowrap;
            text-shadow: 0 0 10px white, 0 0 20px #ff6ec7;
            opacity: 0;
            animation: fade 1s forwards;
        }

        @keyframes fade { to { opacity: 1; } }

        /* corazones centro */
        #centerHearts {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(20px, 4vw, 40px); 
            animation: spin 6s linear infinite;
        }

        .blue { color: #4da6ff; text-shadow: 0 0 20px #4da6ff; }
        .pink { color: #ff6ec7; text-shadow: 0 0 20px #ff6ec7; }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* corazones flotantes */
        .floatHeart {
            position: absolute; font-size: 20px;
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            z-index: 200;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-120px); opacity: 0; }
        }

        /* CONTADOR */
        #countdown-container {
            position: absolute; top: 3%; color: white; text-align: center;
            font-size: clamp(16px, 4vw, 22px); text-shadow: 0 0 15px #ff6ec7; z-index: 10;
        }

        /* CONTENEDOR DEL GIF Y CALENDARIO */
        #content-wrapper {
            position: absolute;
            bottom: 3%;
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: flex-end;
            z-index: 10;
            display: none; /* Oculto al inicio */
        }

        #video-container {
            border: 2px solid #ff6ec7; border-radius: 12px;
            overflow: hidden; box-shadow: 0 0 15px #ff6ec7; width: 180px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #video-container:hover {
            transform: scale(1.05);
        }

        img.gif-media { display: block; width: 100%; height: auto; }

        /* CALENDARIO */
        #calendar-container {
            background: rgba(20, 0, 10, 0.7);
            border: 2px solid #4da6ff;
            border-radius: 12px;
            padding: 10px 15px;
            box-shadow: 0 0 15px #4da6ff;
            font-size: clamp(12px, 2.5vw, 14px);
        }

        #calendar-container h3 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #ff9ac7;
            text-shadow: 0 0 5px #ff9ac7;
            font-size: 16px;
        }
        #toggle-calendar-btn{
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            background: #4da6ff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px #4da6ff;
        }

        #calendar-container {
            display: none;
        }
        .cal-row { display: flex; justify-content: space-between; margin-bottom: 5px; gap: 15px; }
        .cal-days { font-weight: bold; }
        .inf { color: #4da6ff; }
        .fert { color: #ff9ac7; }
        .muy-fert { color: #ff3b3b; font-weight: bold; text-shadow: 0 0 5px rgba(255,59,59,0.5); }

        /* --- MODAL DEL JUEGUITO --- */
        #game-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 300;
            display: none; /* Oculto por defecto */
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            background: #111;
            border: 2px solid #ff6ec7;
            border-radius: 8px;
            box-shadow: 0 0 20px #ff6ec7;
        }

        #score-display {
            color: #ff9ac7;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff9ac7;
        }

        #close-game {
            position: absolute;
            top: 20px; right: 20px;
            background: #ff3b3b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px; height: 40px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff3b3b;
        }

        #game-instructions {
            margin-top: 15px;
            color: #4da6ff;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            #content-wrapper {
                flex-direction: column;
                align-items: center;
                bottom: 2%;
            }
            #video-container { width: 150px; }
        }
    </style>
</head>

<body>

    <div id="login-screen">
        <h2>Ingresa la clave secreta 🤨💖</h2>
        <input type="password" id="password-input" placeholder="Contraseña">
        <div id="error-msg">Clave incorrecta 💔 Intenta de nuevo.</div>
        <button id="login-btn">Entrar</button>
    </div>

    <div id="countdown-container">
        <div id="countdown-text">Faltan <strong id="days-left" style="color: #4da6ff;"></strong> días para el día 🧛🏻 💖</div>
    </div>

    <div id="container">
        <canvas id="heartLine" class="heart"></canvas>
        <div id="centerHearts">
            <span class="blue">💙</span>
            <span class="pink">💗</span>
        </div>
    </div>

    <div id="content-wrapper">
        <div id="video-container" title="¡Haz clic para jugar!">
            <img id="secret-gif" data-src="IMG_3850.gif" alt="Nuestro recuerdo" class="gif-media">
        </div>
        <button id="toggle-calendar-btn">🌸 Mostrar</button>
        <div id="calendar-container">
            <h3>Ciclo 🌸</h3>
            <div class="cal-row"><span class="cal-days">Día 1-9:</span> <span class="inf">infértil</span></div>
            <div class="cal-row"><span class="cal-days">Día 10-12:</span> <span class="fert">fértil</span></div>
            <div class="cal-row"><span class="cal-days">Día 13-16:</span> <span class="muy-fert">MUY FÉRTIL</span></div>
            <div class="cal-row"><span class="cal-days">Día 17-18:</span> <span class="fert">fértil</span></div>
            <div class="cal-row"><span class="cal-days">Día 19-29/30:</span> <span class="inf">infértil</span></div>
        </div>
    </div>

    <div id="game-modal">
        <button id="close-game">X</button>
        <div id="score-display">Zanahorias: 0</div>
        <canvas id="gameCanvas" width="600" height="250"></canvas>
        <div id="game-instructions">Toca la pantalla o presiona Espacio para saltar</div>
    </div>

    <script>
        /* --- LÓGICA DE LA CONTRASEÑA --- */
        const passIn = document.getElementById("password-input");
        const errM = document.getElementById("error-msg");
        const logS = document.getElementById("login-screen");
        
        document.getElementById("login-btn").addEventListener("click", () => {
            if (passIn.value.trim().toLowerCase() === "dani0122") {
                logS.classList.add("unlocked");
                document.getElementById('game-modal').style.display = 'flex';
                
                const secretGif = document.getElementById("secret-gif");
                secretGif.src = secretGif.getAttribute("data-src");
                document.getElementById("content-wrapper").style.display = "flex";

                setTimeout(() => { 
                    logS.style.display = "none"; 
                    reiniciarJuego(); 
                }, 1000);
            } else {
                errM.style.opacity = "1";
                passIn.value = "";
                passIn.classList.add("error");
                setTimeout(() => {
                    errM.style.opacity = "0";
                    passIn.classList.remove("error");
                }, 3000);
            }
        });
        
        passIn.addEventListener("keypress", (e) => { if (e.key === "Enter") document.getElementById("login-btn").click(); });

        /* --- LÓGICA DEL CONTADOR --- */
        const dL = document.getElementById("days-left");
        const cT = document.getElementById("countdown-text");
        function uC() {
            const t = new Date();
            if (t.getDate() === 9) cT.innerHTML = "¡Feliz día 9, mi amor! 🎉💖";
            else {
                let d = new Date(t.getFullYear(), t.getMonth(), 9);
                if (t.getDate() > 9) d.setMonth(d.getMonth() + 1);
                dL.innerText = Math.ceil((d - t) / (1000 * 60 * 60 * 24));
            }
        } uC();

        /* --- DIBUJO DEL CORAZÓN DE LA PANTALLA INICIAL --- */
        const cC = document.getElementById("heartLine");
        const ctC = cC.getContext("2d");
        const c = document.getElementById("container");
        cC.width = c.offsetWidth; cC.height = c.offsetHeight;
        const sz = c.offsetWidth / 2;
        let tim = 0;
        function dr() {
            ctC.clearRect(0, 0, cC.width, cC.height);
            ctC.strokeStyle = "#ff6ec7"; ctC.lineWidth = 3;
            ctC.beginPath();
            for (let i = 0; i < tim; i += 0.02) {
                let x = sz + 16 * Math.pow(Math.sin(i), 3) * (sz / 18);
                let y = sz - (13 * Math.cos(i) - 5 * Math.cos(2 * i) - 2 * Math.cos(3 * i) - Math.cos(4 * i)) * (sz / 18);
                if (i === 0) ctC.moveTo(x, y); else ctC.lineTo(x, y);
            }
            ctC.stroke();
            tim += 0.05;
            if (tim < Math.PI * 2) requestAnimationFrame(dr);
            else {
                for (let i = 0; i < 170; i++) {
                    let a = Math.PI * 2 * i / 170;
                    let x = sz + 16 * Math.pow(Math.sin(a), 3) * (sz / 18);
                    let y = sz - (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * (sz / 18);
                    let s = document.createElement("span"); s.className = "word"; s.innerText = "I love you Dani";
                    s.style.left = x + "px"; s.style.top = y + "px"; s.style.animationDelay = (i * 0.02) + "s";
                    c.appendChild(s);
                }
            }
        } dr();

        /* --- FONDO ESTRELLADO --- */
        for(let i=0; i<100; i++){
            let star = document.createElement("div");
            star.className = "star";
            star.style.left = Math.random()*100+"vw";
            star.style.top = Math.random()*100+"vh";
            document.body.appendChild(star);
        }

        /* --- CORAZÓN AL CLIC EN EL FONDO --- */
        document.addEventListener("click", function(e){
            if (e.target.closest('#video-container') || 
                e.target.closest('#game-modal') ||
                e.target.id === 'login-screen' || 
                e.target.tagName.toLowerCase() === 'input' || 
                e.target.tagName.toLowerCase() === 'button' ||
                e.target.closest('#calendar-container')) return;
                
            let heart = document.createElement("div");
            heart.className = "floatHeart";
            heart.innerHTML = "💗";
            heart.style.left = e.clientX+"px";
            heart.style.top = e.clientY+"px";
            document.body.appendChild(heart);
            setTimeout(()=>heart.remove(), 2000);
        });

        // ==========================================
        // LÓGICA DEL MINIJUEGUITO DEL CONEJO (GEOMÉTRICA SIMPLE)
        // ==========================================

        const canJ = document.getElementById('gameCanvas');
        const ctJ = canJ.getContext('2d');

        const imgBanera = new Image(); imgBanera.src = './banera.png';      
        const imgZanahoria = new Image(); imgZanahoria.src = './carrot.png';  
        const imgFondoDia = new Image(); imgFondoDia.src = './daybg.png';
        const imgFondoNoche = new Image(); imgFondoNoche.src = './nightbg.png';

        const sonidoAgua = new Audio('./splash.mp3');
        const sonidoPuntos = new Audio('./points.mp3');
        const musicaFondo = new Audio('./soundtrack.mp3');
        musicaFondo.loop = true; 

        let score = 0;
        let juegoActivo = false;
        let juegoTerminado = false;
        let frames = 0; 
        let velocidadJuego = 4; 
        let baneras = [];
        let zanahorias = [];

        // Geometría para dibujar la silueta de la conejita
        let conejo = { 
            x: 80, 
            y: 120, 
            tamano: 65,
            hitboxAncho: 45, 
            hitboxAlto: 45 
        };
        
        let gravedad = 1.2;      
        let velocidadY = 0; // Se mantiene tu variable de velocidad vertical de tu original
        let fuerzaSalto = -14;   
        let enSuelo = true;     
        let nivelSuelo = canJ.height - 105; 

        document.getElementById("close-game").addEventListener("click", () => { 
            document.getElementById('game-modal').style.display = 'none'; 
            juegoActivo = false; 
            musicaFondo.pause(); 
        });

        window.addEventListener('keydown', e => { 
            if (e.code === 'Space' && document.getElementById('game-modal').style.display === 'flex') { 
                e.preventDefault(); 
                if (juegoTerminado) {
                    reiniciarJuego();
                } else if (enSuelo) {
                    letY = fuerzaSalto;
                    enSuelo = false;
                }
            } 
        });
        
        canJ.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            if (juegoTerminado) {
                reiniciarJuego();
            } else if (enSuelo) {
                letY = fuerzaSalto;
                enSuelo = false;
            }
        });
        
        function mOP() {
            if (frames % 160 === 0) {
                baneras.push({ x: canJ.width, y: nivelSuelo + 15, anchoHitbox: 30, altoHitbox: 25, anchoVisual: 60, altoVisual: 50 });
            }
            if (frames % 100 === 0) {
                let alturaZanahoria = Math.random() > 0.5 ? nivelSuelo - 5 : nivelSuelo + 25;
                za = { x: canJ.width, y: alturaZanahoria, anchoHitbox: 25, altoHitbox: 25, anchoVisual: 45, altoVisual: 45 };
                zanahorias.push(za);
            }
            if (frames % 500 === 0) velocidadJuego += 0.5;
            
            for (let i = 0; i < baneras.length; i++) {
                let b = baneras[i]; b.x -= velocidadJuego;
                if(imgBanera.complete) ctJ.drawImage(imgBanera, 0, 0, imgBanera.width, imgBanera.height, b.x, b.y, b.anchoVisual, b.altoVisual);
                
                const cCenterX = conejo.x + (conejo.tamano / 2);
                const cCenterY = conejo.y + (conejo.tamano / 2);
                
                if (cCenterX > b.x + (b.anchoVisual/2 - b.anchoHitbox/2) && 
                    cCenterX < b.x + (b.anchoVisual/2 + b.anchoHitbox/2) &&
                    cCenterY > b.y + (b.altoVisual/2 - b.altoHitbox/2) && 
                    cCenterY < b.y + (b.altoVisual/2 + b.altoHitbox/2)) {
                    
                    juegoActivo = false; juegoTerminado = true; sonidoAgua.play().catch(e => {});
                }
            }
            
            for (let i = 0; i < zanahorias.length; i++) {
                let z = zanahorias[i]; z.x -= velocidadJuego;
                if(imgZanahoria.complete) ctJ.drawImage(imgZanahoria, 0, 0, imgZanahoria.width, imgZanahoria.height, z.x, z.y, z.anchoVisual, z.altoVisual);
                
                const cCenterX = conejo.x + (conejo.tamano / 2);
                const cCenterY = conejo.y + (conejo.tamano / 2);

                if (cCenterX > z.x + (z.anchoVisual/2 - z.anchoHitbox/2) && 
                    cCenterX < z.x + (z.anchoVisual/2 + z.anchoHitbox/2) &&
                    cCenterY > z.y + (z.altoVisual/2 - z.altoHitbox/2) && 
                    cCenterY < z.y + (z.altoVisual/2 + z.altoHitbox/2)) {
                    
                    score += 10; sonidoPuntos.play().catch(e => {}); zanahorias.splice(i, 1); i--;
                }
            }
        }
        
        function actF() {
            let etapa = Math.floor(score / 500);
            let fActual = (etapa % 2 === 0) ? imgFondoDia : imgFondoNoche;
            if (fActual.complete) ctJ.drawImage(fActual, 0, 0, canJ.width, canJ.height);
            else {
                ctJ.fillStyle = (etapa % 2 === 0) ? '#70c5eb' : '#181124';
                ctJ.fillRect(0, 0, canJ.width, canJ.height);
            }
            ctJ.fillStyle = (etapa % 2 === 0) ? '#ff6ec7' : '#bd7ffc'; 
            ctJ.fillRect(0, nivelSuelo + conejo.tamano, canJ.width, 4);
        }
        
        function reiniciarJuego() { 
            score = 0; frames = 0; baneras = []; zanahorias = []; conejo.y = nivelSuelo; letY = 0; velocidadJuego = 4; enSuelo = true; juegoTerminado = false; juegoActivo = true; musicaFondo.play().catch(e => {}); 
        }
        
        function actJ() {
            requestAnimationFrame(actJ);
            if (document.getElementById('game-modal').style.display !== 'flex') return;
            ctJ.clearRect(0, 0, canJ.width, canJ.height);
            
            if (juegoTerminado) {
                ctJ.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctJ.fillRect(0, 0, canJ.width, canJ.height);
                ctJ.fillStyle = '#ff3b3b'; ctJ.font = 'bold 32px Arial'; ctJ.textAlign = 'center';
                ctJ.fillText("¡GAME OVER!", canJ.width / 2, canJ.height / 2 - 15);
                ctJ.fillStyle = 'white'; ctJ.font = '20px Arial';
                ctJ.fillText("Zanahorias obtenidas: " + score, canJ.width / 2, canJ.height / 2 + 20);
                ctJ.fillStyle = '#4da6ff'; ctJ.font = '16px Arial';
                ctJ.fillText("Presiona ESPACIO para reiniciar", canJ.width / 2, canJ.height / 2 + 55);
            } else if (juegoActivo) {
                frames++; actF(); mOP();
                
                letY += gravedad; conejo.y += letY;
                if (conejo.y >= nivelSuelo) { conejo.y = nivelSuelo; letY = 0; enSuelo = true; }
                else enSuelo = false;
                
                // Conejita dibujada con trazo de vectores simple (orientada a la derecha)
                ctJ.save();
                ctJ.translate(conejo.x + conejo.tamano, conejo.y);
                ctJ.scale(-1, 1);
                
                ctJ.fillStyle = '#ffb3d1';
                ctJ.beginPath();
                ctJ.arc(20, 25, 20, 0, Math.PI * 2);
                ctJ.fill();

                ctJ.fillStyle = '#ffffff';
                ctJ.beginPath();
                ctJ.arc(40, 15, 18, 0, Math.PI * 2);
                ctJ.fill();

                ctJ.fillStyle = '#ffffff';
                ctJ.beginPath();
                ctJ.ellipse(30, -5, 6, 15, 0, 0, Math.PI * 2);
                ctJ.ellipse(45, -5, 6, 15, 0, 0, Math.PI * 2);
                ctJ.fill();

                ctJ.fillStyle = '#000000';
                ctJ.beginPath();
                ctJ.arc(42, 12, 2, 0, Math.PI * 2);
                ctJ.fill();
                
                ctJ.restore();
            }
            document.getElementById('score-display').innerText = "Zanahorias: " + score;
        }
        requestAnimationFrame(actJ);

    </script>
</body>

</html>
