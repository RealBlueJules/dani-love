<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="Para Dani ❤️">
    <meta property="og:description" content="Sorpresa...">

    <title>Para Dani 💙</title>

    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
        }

        /* --- PANTALLA DE BLOQUEO --- */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff9ac7;
            transition: all 1s ease;
        }

        .unlocked {
            transform: scale(1.5);
            opacity: 0;
            pointer-events: none;
        }

        #login-screen h2 {
            text-shadow: 0 0 15px #ff6ec7;
            margin-bottom: 20px;
            font-size: clamp(20px, 5vw, 30px);
            text-align: center;
        }

        #password-input {
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ff6ec7;
            border-radius: 10px;
            background: transparent;
            color: white;
            text-align: center;
            margin-bottom: 10px;
            outline: none;
            box-shadow: 0 0 10px #ff6ec7;
            transition: 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .error {
            animation: shake 0.4s ease-in-out;
            border-color: #ff3b3b !important;
            box-shadow: 0 0 15px #ff3b3b !important;
        }

        #error-msg {
            color: #ff3b3b;
            font-size: 14px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            margin-bottom: 20px;
            text-shadow: 0 0 5px #ff3b3b;
        }

        #login-btn {
            padding: 10px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: #ff6ec7;
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px #ff6ec7;
            transition: 0.3s;
        }

        #login-btn:hover {
            background: #ff9ac7;
            transform: scale(1.05);
        }

        /* estrellas */
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            opacity: 0.8;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }

        /* contenedor del corazón */
        #container {
            position: absolute;
            top: 20%;
            width: min(50vw, 280px);
            height: min(50vw, 280px);
            animation: beat 1.3s infinite;
            z-index: 5;
        }

        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.07); }
            100% { transform: scale(1); }
        }

        canvas.heart { position: absolute; top: 0; left: 0; }

        /* palabras */
        .word {
            position: absolute;
            color: #ff9ac7;
            font-size: clamp(8px, 1.5vw, 12px); 
            white-space: nowrap;
            text-shadow: 0 0 10px white, 0 0 20px #ff6ec7;
            opacity: 0;
            animation: fade 1s forwards;
        }

        @keyframes fade { to { opacity: 1; } }

        /* corazones centro */
        #centerHearts {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(20px, 4vw, 40px); 
            animation: spin 6s linear infinite;
        }

        .blue { color: #4da6ff; text-shadow: 0 0 20px #4da6ff; }
        .pink { color: #ff6ec7; text-shadow: 0 0 20px #ff6ec7; }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* corazones flotantes */
        .floatHeart {
            position: absolute; font-size: 20px;
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            z-index: 200;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-120px); opacity: 0; }
        }

        /* CONTADOR */
        #countdown-container {
            position: absolute; top: 3%; color: white; text-align: center;
            font-size: clamp(16px, 4vw, 22px); text-shadow: 0 0 15px #ff6ec7; z-index: 10;
        }

        /* CONTENEDOR DEL GIF Y CALENDARIO */
        #content-wrapper {
            position: absolute;
            bottom: 3%;
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: flex-end;
            z-index: 10;
            display: none; /* Oculto al inicio */
        }

        #video-container {
            border: 2px solid #ff6ec7; border-radius: 12px;
            overflow: hidden; box-shadow: 0 0 15px #ff6ec7; width: 180px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #video-container:hover {
            transform: scale(1.05);
        }

        img.gif-media { display: block; width: 100%; height: auto; }

        /* CALENDARIO */
        #calendar-container {
            background: rgba(20, 0, 10, 0.7);
            border: 2px solid #4da6ff;
            border-radius: 12px;
            padding: 10px 15px;
            box-shadow: 0 0 15px #4da6ff;
            font-size: clamp(12px, 2.5vw, 14px);
        }

        #calendar-container h3 {
            margin: 0 0 10px 0;
            text-align: center;
            color: #ff9ac7;
            text-shadow: 0 0 5px #ff9ac7;
            font-size: 16px;
        }
        #toggle-calendar-btn {
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            background: #4da6ff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            box-shadow:0 0 10px #4da6ff;
        }

        #calendar-container {
            display: none;
        }
        .cal-row { display: flex; justify-content: space-between; margin-bottom: 5px; gap: 15px; }
        .cal-days { font-weight: bold; }
        .inf { color: #4da6ff; }
        .fert { color: #ff9ac7; }
        .muy-fert { color: #ff3b3b; font-weight: bold; text-shadow: 0 0 5px rgba(255,59,59,0.5); }

        /* --- MODAL DEL JUEGO --- */
        #game-modal {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 300;
            display: none; /* Oculto por defecto */
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            background: #111;
            border: 2px solid #ff6ec7;
            border-radius: 8px;
            box-shadow: 0 0 20px #ff6ec7;
        }

        #score-display {
            color: #ff9ac7;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff9ac7;
        }

        #close-game {
            position: absolute;
            top: 20px; right: 20px;
            background: #ff3b3b;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px; height: 40px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff3b3b;
        }

        #game-instructions {
            margin-top: 15px;
            color: #4da6ff;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            #content-wrapper {
                flex-direction: column;
                align-items: center;
                bottom: 2%;
            }
            #video-container { width: 150px; }
        }
    </style>
</head>

<body>

    <div id="login-screen">
        <h2>Ingresa la clave secreta 🤨💖</h2>
        <input type="password" id="password-input" placeholder="Contraseña">
        <div id="error-msg">Clave incorrecta 💔 Intenta de nuevo.</div>
        <button id="login-btn">Entrar</button>
    </div>

    <div id="countdown-container">
        <div id="countdown-text">Faltan <strong id="days-left" style="color: #4da6ff;"></strong> días para el día 🧛🏻 💖</div>
    </div>

    <div id="container">
        <canvas id="heartLine" class="heart"></canvas>
        <div id="centerHearts">
            <span class="blue">💙</span>
            <span class="pink">💗</span>
        </div>
    </div>

    <div id="content-wrapper">
        <div id="video-container" title="¡Haz clic para jugar!">
            <img id="secret-gif" data-src="IMG_3850.gif" alt="Nuestro recuerdo" class="gif-media">
        </div>
        <button id="toggle-calendar-btn">🌸 Mostrar</button>
        <div id="calendar-container">
            <h3>Ciclo 🌸</h3>
            <div class="cal-row"><span class="cal-days">Día 1-9:</span> <span class="inf">infértil</span></div>
            <div class="cal-row"><span class="cal-days">Día 10-12:</span> <span class="fert">fértil</span></div>
            <div class="cal-row"><span class="cal-days">Día 13-16:</span> <span class="muy-fert">MUY FÉRTIL</span></div>
            <div class="cal-row"><span class="cal-days">Día 17-18:</span> <span class="fert">fértil</span></div>
            <div class="cal-row"><span class="cal-days">Día 19-29/30:</span> <span class="inf">infértil</span></div>
        </div>
    </div>

    <div id="game-modal">
        <button id="close-game">X</button>
        <div id="score-display">Puntos: 0</div>
        <canvas id="gameCanvas" width="600" height="250"></canvas>
        <div id="game-instructions">Toca la pantalla o presiona Espacio para saltar</div>
    </div>

    <script>
        /* --- LÓGICA DE LA CONTRASEÑA --- */
        const passIn = document.getElementById("password-input");
        const errM = document.getElementById("error-msg");
        const logS = document.getElementById("login-screen");

        document.getElementById("login-btn").addEventListener("click", () => {
            const inputVal = passIn.value.trim().toLowerCase();
            if (inputVal === "dani0122") {
                logS.classList.add("unlocked");
                document.getElementById('game-modal').style.display = 'flex';
                
                const secretGif = document.getElementById("secret-gif");
                secretGif.src = secretGif.getAttribute("data-src");
                document.getElementById("content-wrapper").style.display = "flex";

                setTimeout(() => { 
                    logS.style.display = "none"; 
                    reiniciarJuego(); 
                }, 1000);
            } else {
                errM.style.opacity = "1";
                passIn.value = "";
                passIn.classList.add("error");
                setTimeout(() => {
                    errM.style.opacity = "0";
                    passIn.classList.remove("error");
                }, 3000);
            }
        });
        
        passIn.addEventListener("keypress", (e) => { if (e.key === "Enter") document.getElementById("login-btn").click(); });

        /* --- LÓGICA DEL CONTADOR --- */
        const dL = document.getElementById("days-left");
        const cT = document.getElementById("countdown-text");
        function uC() {
            const t = new Date();
            if (t.getDate() === 9) cT.innerHTML = "¡Feliz día 9, mi amor! 🎉💖";
            else {
                let d = new Date(t.getFullYear(), t.getMonth(), 9);
                if (t.getDate() > 9) d.setMonth(d.getMonth() + 1);
                dL.innerText = Math.ceil((d - t) / (1000 * 60 * 60 * 24));
            }
        } uC();

        const cC = document.getElementById("heartLine");
        const ctC = cC.getContext("2d");
        const c = document.getElementById("container");
        cC.width = c.offsetWidth; cC.height = c.offsetHeight;
        const sz = c.offsetWidth / 2;
        let tim = 0;
        function dr() {
            ctC.clearRect(0, 0, cC.width, cC.height);
            ctC.strokeStyle = "#ff6ec7"; ctC.lineWidth = 3;
            ctC.beginPath();
            for (let i = 0; i < tim; i += 0.02) {
                let x = sz + 16 * Math.pow(Math.sin(i), 3) * (sz / 18);
                let y = sz - (13 * Math.cos(i) - 5 * Math.cos(2 * i) - 2 * Math.cos(3 * i) - Math.cos(4 * i)) * (sz / 18);
                if (i === 0) ctC.moveTo(x, y); else ctC.lineTo(x, y);
            }
            ctC.stroke();
            tim += 0.05;
            if (tim < Math.PI * 2) requestAnimationFrame(dr);
            else {
                for (let i = 0; i < 170; i++) {
                    let a = Math.PI * 2 * i / 170;
                    let x = sz + 16 * Math.pow(Math.sin(a), 3) * (sz / 18);
                    let y = sz - (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * (sz / 18);
                    let s = document.createElement("span"); s.className = "word"; s.innerText = "I love you Dani";
                    s.style.left = x + "px"; s.style.top = y + "px"; s.style.animationDelay = (i * 0.02) + "s";
                    c.appendChild(s);
                }
            }
        } dr();

        /* --- FONDO ESTRELLADO --- */
        for(let i=0; i<100; i++){
            let star = document.createElement("div");
            star.className = "star";
            star.style.left = Math.random()*100+"vw";
            star.style.top = Math.random()*100+"vh";
            document.body.appendChild(star);
        }

        /* --- CORAZÓN AL CLIC --- */
        document.addEventListener("click", function(e){
            if (e.target.closest('#video-container') || 
                e.target.closest('#game-modal') ||
                e.target.id === 'login-screen' || 
                e.target.tagName.toLowerCase() === 'input' || 
                e.target.tagName.toLowerCase() === 'button') return;
                
            let heart = document.createElement("div");
            heart.className = "floatHeart";
            heart.innerHTML = "💗";
            heart.style.left = e.clientX+"px";
            heart.style.top = e.clientY+"px";
            document.body.appendChild(heart);
            setTimeout(()=>heart.remove(), 2000);
        });

        /* --- LÓGICA DEL CALENDARIO --- */
        document.getElementById("toggle-calendar-btn").addEventListener("click", () => {
            const cal = document.getElementById("calendar-container");
            if(cal.style.display === "none" || cal.style.display === ""){
                cal.style.display = "block";
                document.getElementById("toggle-calendar-btn").innerText = "Ocultar 🌸";
            } else {
                cal.style.display = "none";
                document.getElementById("toggle-calendar-btn").innerText = "Mostrar 🌸";
            }
        });

        // ==========================================
        // LÓGICA DEL MINIJUEGUITO DEL CONEJO (FLUJO CONTINUO)
        // ==========================================

        const canJ = document.getElementById('gameCanvas');
        const ctJ = canJ.getContext('2d');
        
        const imR = new Image(); imR.src = 'runbunny.png';
        const imJ = new Image(); imJ.src = 'jumpbunny.png';
        const imB = new Image(); imB.src = 'banera.png';
        const imZ = new Image(); imZ.src = 'carrot.png';
        const imD = new Image(); imD.src = 'daybg.png';
        const imN = new Image(); imN.src = 'nightbg.png';
        
        const snA = new Audio('splash.mp3');
        const snP = new Audio('points.mp3');
        const msF = new Audio('soundtrack.mp3'); msF.loop = true;
        
        let sc = 0, f = 0, vj = 4, ja = false, enS = false, fAct = 0, cAn = 0, vY = 0;
        let ba = [], za = [];
        
        // Medida del marco de dibujo (ancho 75, alto 80) sin distorsión
        let cn = { x: 50, y: 50, an: 75, al: 80, ht: { an: 30, al: 50 } };
        let gr = 1.5, fS = -16, nS = canJ.height - 90;
        
        function saltar() { vY = fS; enS = false; }
        
        document.getElementById("close-game").addEventListener("click", () => { 
            document.getElementById('game-modal').style.display = 'none'; 
            ja = false; 
            msF.pause(); 
        });
        
        window.addEventListener('keydown', (e) => { 
            if (e.code === 'Space' && ja) { 
                e.preventDefault(); 
                if (enS) saltar(); 
            } 
        });
        
        canJ.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            if (ja && enS) saltar(); 
        });
        
        function mOP() {
            if (f % 160 === 0) ba.push({ x: canJ.width, y: nS + 35, an: 55, al: 35, ht: { an: 35, al: 20 } });
            if (f % 100 === 0) za.push({ x: canJ.width, y: Math.random() > 0.5 ? nS - 10 : nS + 20, an: 40, al: 40, ht: { an: 25, al: 25 } });
            if (f % 500 === 0) vj += 0.5;
            
            for (let i = ba.length - 1; i >= 0; i--) {
                let b = ba[i]; b.x -= vj;
                // Dibujamos la bañera solo si está cargada (evitamos detener el juego)
                ctJ.drawImage(imB, b.x, b.y, b.an, b.al);
                if (cn.x < b.x + b.ht.an && cn.x + cn.ht.an > b.x && cn.y < b.y + b.ht.al && cn.y + cn.ht.al > b.y) {
                    ja = false; snA.play(); alert("¡Te caíste en la bañera! 💦 Recogiste " + sc + " zanahorias."); reiniciarJuego();
                }
                if (b.x + b.an < 0) ba.splice(i, 1);
            }
            
            for (let i = za.length - 1; i >= 0; i--) {
                let z = za[i]; z.x -= vj;
                ctJ.drawImage(imZ, z.x, z.y, z.an, z.al);
                if (cn.x < z.x + z.ht.an && cn.x + cn.ht.an > z.x && cn.y < z.y + z.ht.al && cn.y + cn.ht.al > z.y) {
                    sc += 10; snP.play(); za.splice(i, 1);
                }
                if (z.x + z.an < 0) za.splice(i, 1);
            }
        }
        
        function actF() {
            let e = Math.floor(sc / 500);
            let i = (e % 2 === 0) ? imD : imN;
            ctJ.drawImage(i, 0, 0, canJ.width, canJ.height);
            ctJ.fillStyle = (e % 2 === 0) ? '#ff6ec7' : '#bd7ffc'; 
            ctJ.fillRect(0, nS + 60, canJ.width, 2);
        }
        
        function reiniciarJuego() { 
            sc = 0; f = 0; vj = 4; cn.y = nS; vY = 0; ja = true; msF.play(); ba = []; za = []; 
        }
        
        function actJ() {
            // El juego se ejecutará sin pausas ni esperas de imágenes
            if (ja) {
                f++; 
                ctJ.clearRect(0, 0, canJ.width, canJ.height); 
                actF(); 
                mOP();
                
                vY += gr; 
                cn.y += vY;
                
                if (cn.y > nS) { 
                    cn.y = nS; 
                    vY = 0; 
                    enS = true; 
                }
                
                if (!enS) { 
                    // SALTO: Dibuja el frame de salto respetando la caja fija (75x80)
                    ctJ.drawImage(imJ, 0, 0, imJ.width, imJ.height, cn.x, cn.y - 15, cn.an, cn.al); 
                } else {
                    // CARRERA: Se divide el ancho total entre 8 de forma nativa. Mantiene la caja (75x80)
                    let w = imR.width / 8;
                    ctJ.drawImage(imR, fAct * w, 0, w, imR.height, cn.x, cn.y - 5, cn.an, cn.al);
                    if (++cAn % 6 === 0) fAct = (fAct + 1) % 8;
                }
                document.getElementById('score-display').innerText = "Zanahorias: " + sc;
            } 
            requestAnimationFrame(actJ);
        } 
        
        // Arrancamos el motor sin restricciones
        requestAnimationFrame(actJ);

    </script>
</body>
</html>
